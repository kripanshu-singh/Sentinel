services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: breakmyapi
      POSTGRES_USER: breakmyapi
      POSTGRES_PASSWORD: breakmyapi
    ports:
      - "5432:5432"
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakmyapi -d breakmyapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - sentinel-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinel-postgres-data:
  sentinel-redis-data:
